<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>프로그램 장소 안내</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#1c1b1a; --ink2:#57534e; --ink3:#8a857e;
    --paper:#f6f4ef; --card:#ffffff; --line:#e7e3db;
    --school:#0f766e; --school-bg:#e5f3f0; --school-line:#9fd6cd;
    --bus:#b45309; --bus-bg:#fbf0dc; --bus-line:#f0cd91;
    --walk:#4338ca; --walk-bg:#e9e8fb; --walk-line:#bfbcf0;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper); color:var(--ink);
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px;min-height:100vh}

  .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .brand .date{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
  h1{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
  .sub{font-size:13.5px;color:var(--ink2);margin-bottom:22px}

  .search{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px 16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 6px 2px;letter-spacing:.01em}
  .field input{
    width:100%;font-size:17px;font-family:inherit;font-weight:500;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 14px;outline:none;transition:border-color .15s,background .15s;
  }
  .field input:focus{border-color:var(--ink);background:#fff}
  .field input::placeholder{color:var(--ink3);font-weight:400}
  .go{width:100%;margin-top:4px;font-family:inherit;font-size:16px;font-weight:700;color:#fff;
    background:var(--ink);border:none;border-radius:12px;padding:14px;cursor:pointer;
    transition:transform .06s,opacity .15s;letter-spacing:.01em}
  .go:active{transform:scale(.985)}
  .hint{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:11px;line-height:1.5}

  #result{margin-top:22px}
  .fade{animation:rise .28s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .rtop{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--line)}
  .rtop .who{display:flex;flex-direction:column;gap:1px}
  .rtop .nm{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .rtop .sid{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:600}
  .tag{font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
  .tag.school{color:var(--school);background:var(--school-bg)}
  .tag.bus{color:var(--bus);background:var(--bus-bg)}
  .tag.walk{color:var(--walk);background:var(--walk-bg)}

  .accent-school{border-top:4px solid var(--school)}
  .accent-bus{border-top:4px solid var(--bus)}
  .accent-walk{border-top:4px solid var(--walk)}

  .rbody{padding:6px 18px 18px}
  .prog{font-size:14px;color:var(--ink2);padding:14px 0 4px;font-weight:500;line-height:1.5}
  .prog b{color:var(--ink);font-weight:800}

  .period{display:flex;gap:13px;padding:15px 0;border-top:1px dashed var(--line)}
  .period:first-of-type{border-top:none}
  .pchip{flex:0 0 auto;width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-weight:800;line-height:1}
  .pchip.school{background:var(--school-bg);color:var(--school)}
  .pchip .pn{font-size:19px;letter-spacing:-.02em}
  .pchip .pl{font-size:9.5px;margin-top:3px;font-weight:700;opacity:.8}
  .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .pinfo .plabel{font-size:12.5px;color:var(--ink3);font-weight:600}
  .pinfo .proom{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .tline{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--school);
    background:var(--school-bg);padding:3px 9px;border-radius:8px;align-self:flex-start;margin-top:1px}
  .tline .tk{font-size:11px;font-weight:700;opacity:.75}

  .pass{margin:16px 0 4px;border-radius:16px;background:var(--bus-bg);border:1.5px dashed var(--bus-line);
    padding:16px 18px;display:flex;align-items:center;gap:16px}
  .pass .big{font-size:40px;font-weight:900;color:var(--bus);line-height:1;letter-spacing:-.03em;
    display:flex;flex-direction:column;align-items:center}
  .pass .big .cx{font-size:13px;font-weight:800;margin-top:4px;letter-spacing:.04em}
  .pass .pmeta{flex:1;min-width:0}
  .pass .pmeta .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
  .pass .pmeta .row .k{color:var(--bus);font-weight:700;opacity:.85;white-space:nowrap}
  .pass .pmeta .row .v{color:var(--ink);font-weight:700;text-align:right}

  .info{padding:13px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
  .info .k{font-size:13px;color:var(--ink3);font-weight:600;white-space:nowrap}
  .info .v{font-size:15px;font-weight:700;text-align:right}
  .teacher-hi .v{font-size:16px}
  .info.teacher-hi.bus .v{color:var(--bus)}
  .info.teacher-hi.walk .v{color:var(--walk)}

  .note{margin-top:16px;font-size:12.5px;line-height:1.6;padding:12px 14px;border-radius:12px}
  .note.school{background:var(--school-bg);color:#0b5049}
  .note.bus{background:var(--bus-bg);color:#7a3908}
  .note.walk{background:var(--walk-bg);color:#332aa0}
  .note b{font-weight:800}

  .again{width:100%;margin-top:16px;font-family:inherit;font-size:14px;font-weight:700;
    color:var(--ink2);background:transparent;border:1.5px solid var(--line);border-radius:12px;
    padding:12px;cursor:pointer}
  .again:active{background:var(--paper)}

  .err{background:#fff;border:1px solid #f0d6d0;border-radius:var(--radius);padding:22px 20px;text-align:center}
  .err .ic{font-size:30px}
  .err .t{font-size:16px;font-weight:800;margin:8px 0 4px;color:#b3452e}
  .err .d{font-size:13.5px;color:var(--ink2);line-height:1.55}
  .foot{text-align:center;font-size:11px;color:var(--ink3);margin-top:34px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="date">2026학년도 1학기말 · 1·2학년 진로탐색 프로그램</span></div>
  <h1>프로그램 장소 안내</h1>
  <p class="sub">학번과 이름으로 내 장소를 확인하세요</p>

  <div class="search">
    <div class="field">
      <label for="sid">학번</label>
      <input id="sid" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="예: 1171" autocomplete="off">
    </div>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" placeholder="예: 김안성" autocomplete="off">
    </div>
    <button class="go" id="go">내 장소 확인하기</button>
    <p class="hint">학번 4자리와 이름을 정확히 입력해 주세요.</p>
  </div>

  <div id="result"></div>
  <p class="foot">기타 문의는 담당 선생님께 확인해 주세요.</p>
</div>

function showErr(title,desc){

  if(!name){ showErr('이름을 입력해 주세요','학번과 이름을 함께 입력해야 조회할 수 있어요.'); return; }
  const rec=STUDENTS[sid];
  if(!rec){ showErr('명단에서 찾을 수 없어요','입력한 학번의 학생이 명단에 없습니다. 학번을 다시 확인하거나 담당 선생님께 문의해 주세요.'); return; }
  if(norm(rec.name)!==name){ showErr('학번과 이름이 일치하지 않아요',`학번 ${sid}의 이름과 다릅니다. 이름을 다시 확인해 주세요.`); return; }
  render(rec);
}
$('go').onclick=search;
$('name').addEventListener('keydown',e=>{ if(e.key==='Enter') search(); });
$('sid').addEventListener('keydown',e=>{ if(e.key==='Enter') $('name').focus(); });
$('sid').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,''); });
</script>
</body>
